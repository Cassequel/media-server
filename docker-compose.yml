services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: rockflix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rockflix-net

  api:
    image: "${ROCKFLIX_API_IMAGE:-rockflix-api}"
    build: ./Rockflix.API
    cpus: "${ROCKFLIX_API_CPUS:-4.0}"
    restart: always
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=rockflix;Username=postgres;Password=${DB_PASSWORD}"
      ASPNETCORE_URLS: "http://+:5244"
      ASPNETCORE_ENVIRONMENT: "Production"
      Media__RootPath: "/mnt/media"
      Media__CachePath: "${ROCKFLIX_CACHE_PATH:-/var/cache/rockflix}"
      Media__CacheMaxBytes: "${ROCKFLIX_CACHE_MAX_BYTES:-8589934592}"
      Encoding__CodecThreads: "${ROCKFLIX_CODEC_THREADS:-2}"
      Encoding__FilterThreads: "${ROCKFLIX_FILTER_THREADS:-1}"
      Filtering__Enabled: "${ROCKFLIX_FILTERING_ENABLED:-false}"
      DoesTheDogDie__ApiKey: "${DOESTHEDOGDIE_API_KEY:-}"
      CleanStream__AllowedTmdbIds: "${ROCKFLIX_CLEANSTREAM_PILOT_TMDB_IDS:-}"
      Filtering__LibraryPath: "${ROCKFLIX_FILTERING_LIBRARY_PATH:-/mnt/media/Rockflix/Movies}"
      Filtering__WorkPath: "${ROCKFLIX_FILTERING_WORK_PATH:-/mnt/media/Rockflix/.processing}"
      Filtering__AcquisitionPath: "/mnt/media/Movies/.rockflix-acquisition"
      Filtering__RadarrAcquisitionPath: "/movies/.rockflix-acquisition"
      Filtering__FreeSpaceFloorBytes: "10737418240"
      Filtering__WebhookSecret: "${ROCKFLIX_WEBHOOK_SECRET:-}"
      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "Rockflix"
      Jwt__Audience: "RockflixUsers"
      Tmdb__ApiKey: "${TMDB_API_KEY}"
      Radarr__BaseUrl: "http://192.168.86.101:7878"
      Radarr__ApiKey: "${RADARR_API_KEY}"
      Sonarr__BaseUrl: "http://192.168.86.101:8989"
      Sonarr__ApiKey: "${SONARR_API_KEY}"
      Telegram__BotToken: "${TELEGRAM_BOT_TOKEN}"
      Telegram__InviteCode: "${TELEGRAM_INVITE_CODE}"
      Anthropic__ApiKey: "${ANTHROPIC_API_KEY}"
      Radarr__RootFolderPath: "/movies"
      Sonarr__RootFolderPath: "/tv"
    volumes:
      - /mnt/media:/mnt/media
      - stream_cache:/var/cache/rockflix
    depends_on:
      - db
    networks:
      - rockflix-net

  client:
    image: "${ROCKFLIX_CLIENT_IMAGE:-rockflix-client}"
    build: ./rockflix-client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - rockflix-net

volumes:
  postgres_data:
  stream_cache:

networks:
  rockflix-net:
